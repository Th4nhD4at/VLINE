<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLINE - App Chat Cá Nhân</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="dark-theme">

    <!-- Màn hình Auth (Đăng nhập / Đăng ký) -->
    <div id="loginScreen" class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header-logo">
                <div class="zalo-logo-badge">VLINE</div>
                <h2 id="authTitle">Đăng Nhập Chat</h2>
            </div>
            
            <div class="auth-tabs">
                <button id="tabLoginBtn" class="auth-tab active" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button id="tabRegisterBtn" class="auth-tab" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <div id="authErrorMsg" class="error-msg"></div>

            <div class="input-group">
                <input type="text" id="usernameInput" placeholder="Tên đăng nhập (min 3 ký tự)..." onkeypress="if(event.key==='Enter') submitAuth()">
            </div>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="Mật khẩu..." onkeypress="if(event.key==='Enter') submitAuth()">
            </div>

            <button id="authSubmitBtn" class="btn-primary" onclick="submitAuth()">Đăng Nhập</button>
        </div>
    </div>

    <!-- App Main Layout (VLINE 3-Column Layout) -->
    <div id="chatScreen" class="app-container">
        
        <!-- 1. Left Vertical Navigation Rail -->
        <nav class="nav-rail">
            <div class="nav-top">
                <div class="user-avatar-main" id="navUserAvatar" title="Hồ sơ cá nhân">
                    <span id="navUserInitial">V</span>
                    <span class="online-indicator"></span>
                </div>
                <div class="nav-items">
                    <button id="navMessageBtn" class="nav-item active" title="Tin nhắn" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                        </svg>
                    </button>
                    <button class="nav-item" title="Danh bạ">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </button>
                    <button class="nav-item" title="Cloud / Truyền file">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                        </svg>
                    </button>
                    <button class="nav-item" title="Công việc">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="nav-bottom">
                <button class="nav-item logout-btn" onclick="logoutUser()" title="Đăng xuất">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- 2. Sidebar (Chat List & Filter) -->
        <aside class="sidebar-panel">
            <div class="search-header">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="search-icon">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm trên VLINE" oninput="filterUserList()">
                </div>
                <button class="icon-btn" title="Thêm bạn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9 0c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm9 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45v1.5h6v-1.5c0-2.35-3.95-3.5-7-3.5z"/></svg>
                </button>
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active">Tất cả</button>
                <button class="filter-tab">Chưa đọc</button>
                <div class="filter-dropdown">
                    <span>Phân loại ▾</span>
                </div>
            </div>

            <ul class="chat-list" id="userList">
                <!-- User items populated dynamically -->
            </ul>
        </aside>

        <!-- 3. Main Chat Workspace -->
        <main class="chat-workspace">
            <!-- Header bar -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="header-avatar" id="headerAvatar">G</div>
                    <div class="header-text">
                        <div class="chat-title" id="currentChatTitle">Phòng Chat Chung</div>
                        <div class="chat-subtitle" id="currentChatSubtitle">Lưu và đồng bộ dữ liệu giữa các thiết bị</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" title="Tìm kiếm trong cuộc trò chuyện">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </button>
                    <button class="icon-btn" title="Thông tin cuộc trò chuyện">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Pinned Banner -->
            <div id="pinnedBanner" class="pinned-banner" style="display: none;">
                <div class="pinned-icon">📌</div>
                <div class="pinned-content" onclick="scrollToPinnedMessage()">
                    <span class="pinned-label">Tin nhắn đã ghim:</span>
                    <span id="pinnedText" class="pinned-text"></span>
                </div>
                <button class="unpin-btn" onclick="unpinCurrentMessage()" title="Bỏ ghim">✕</button>
            </div>

            <!-- Messages Window -->
            <div class="messages-container" id="messagesContainer">
                <!-- Messages rendered dynamically -->
            </div>

            <!-- Input Footer Toolbar & Text Area -->
            <div class="chat-input-panel">
                <!-- Reply Preview Bar -->
                <div id="replyPreviewBar" class="reply-preview-bar" style="display: none;">
                    <div class="reply-info">
                        <span class="reply-label">Đang trả lời </span>
                        <strong id="replySenderName"></strong>: 
                        <span id="replyTextSnippet" class="reply-snippet"></span>
                    </div>
                    <button class="cancel-reply-btn" onclick="cancelReply()" title="Hủy trả lời">✕</button>
                </div>

                <!-- Toolbar icons above input -->
                <div class="input-toolbar">
                    <button class="tool-btn" title="Biểu cảm" onclick="insertEmoji('😊')">😊</button>
                    <button class="tool-btn" title="Gửi hình ảnh">🖼️</button>
                    <button class="tool-btn" title="Đính kèm tệp">📎</button>
                    <button class="tool-btn" title="Chụp màn hình">✂️</button>
                    <button class="tool-btn" title="Định dạng tin nhắn">🅰️</button>
                    <button class="tool-btn" title="Tin nhắn nhanh">💬</button>
                </div>

                <!-- Input box area -->
                <div class="input-row">
                    <input type="text" id="messageInput" placeholder="Nhập @, tin nhắn tới..." oninput="updateSendBtnState()" onkeypress="if(event.key==='Enter') sendMessage()">
                    <div class="input-actions">
                        <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="Gửi tin nhắn">
                            👍
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Context Menu (Menu chuột phải với biểu tượng chi tiết) -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <div class="context-menu-item" onclick="handleMenuReply()">
            <span class="menu-icon">💬</span> Trả lời
        </div>
        <div class="context-menu-item" onclick="handleMenuCopy()">
            <span class="menu-icon">📋</span> Sao chép nội dung
        </div>
        <div id="menuPinItem" class="context-menu-item" onclick="handleMenuPin()">
            <span class="menu-icon">📌</span> Ghim tin nhắn
        </div>
        <div id="menuUnpinItem" class="context-menu-item" onclick="handleMenuUnpin()" style="display: none;">
            <span class="menu-icon">📌</span> Bỏ ghim tin nhắn
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item danger" onclick="handleMenuDelete()">
            <span class="menu-icon">🗑️</span> Thu hồi / Xóa tin nhắn
        </div>
    </div>

    <!-- Scripts (load theo thứ tự dependency) -->
    <script src="./js/app.js"></script>         <!-- 1. Global state & bootstrap -->
    <script src="./js/auth.js"></script>        <!-- 2. Login / Register / Logout -->
    <script src="./js/render.js"></script>      <!-- 3. Render tin nhắn & user list -->
    <script src="./js/contextMenu.js"></script> <!-- 4. Context menu chuột phải -->
    <script src="./js/chat.js"></script>        <!-- 5. Chat logic & gửi tin nhắn -->
    <script src="./js/socket.js"></script>      <!-- 6. Socket.IO realtime events -->
</body>
</html>
